name: gamestore_app
description: "GameStore - Tienda de videojuegos multiplataforma."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.34.5
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_base.png"
  adaptive_icon_background: "#0B0E14"
  adaptive_icon_foreground: "assets/icons/icon_base.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  uses-material-design: true
